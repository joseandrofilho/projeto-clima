<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%85%3C/text%3E%3C/svg%3E"
    />
    <title>Clima</title>
  </head>
  <body>
    <div id="app">
      <header class="search">
        <h1 class="sr-only">Clima</h1>
        <form id="search-form" class="search__form" role="search">
          <label for="search-input" class="sr-only">Nome da cidade</label>
          <input
            id="search-input"
            class="search__input"
            type="text"
            name="city"
            placeholder="Digite o nome da cidade..."
            autocomplete="off"
          />
          <button id="search-button" class="search__button" type="submit">Buscar</button>
        </form>
      </header>

      <main id="result-card" class="card" aria-live="polite"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
